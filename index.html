<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HN SmartMap - Pangea</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html, body {
  height: 100%;
  margin: 0;
}

#map {
  height: 100%;
  width: 100%;
}

.info {
  position: absolute;
  top: 10px;
  left: 50px;
  z-index: 1000;
  background: white;
  padding: 10px;
  border-radius: 8px;
  font-family: Arial;
  box-shadow: 0 0 10px rgba(0,0,0,.3);
  width: 260px;
}

button {
  width: 100%;
  margin-top: 6px;
  padding: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="info">
  <b>HN SmartMap</b><br>
  Mundo Pangea<br><br>

  <div id="lista"></div>

  <button onclick="ubicar()">📍 Mi ubicación</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ---------------------------
// CREAR MAPA
// ---------------------------

var mapa = L.map('map', {
  minZoom: 16,
  maxZoom: 22
});


// ---------------------------
// MAPA BASE OPENSTREETMAP
// ---------------------------

var osm = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 22,
    attribution: '&copy; OpenStreetMap'
  }
).addTo(mapa);


// ---------------------------
// ORTOMOSAICO PANGEA
// TESSELAS GENERADAS POR QGIS
// ---------------------------

var pangea = L.tileLayer(
  './{z}/{x}/{y}.jpg',
  {
    minZoom: 17,
    maxZoom: 21,
    maxNativeZoom: 21,
    tms: false,
    opacity: 1
  }
).addTo(mapa);


// ---------------------------
// EXTENSIÓN DE PANGEA
// ---------------------------

var limites = [
  [5.922010, -74.728629],
  [5.925396, -74.724673]
];

mapa.fitBounds(limites);


// ---------------------------
// CONTROL DE CAPAS
// ---------------------------

L.control.layers(
  {
    "OpenStreetMap": osm
  },
  {
    "Ortomosaico Pangea": pangea
  }
).addTo(mapa);


// ---------------------------
// CARGAR PUNTOS GEOJSON
// ---------------------------

fetch('puntos_pangea.geojson')

.then(r => r.json())

.then(function(datos){

  var lista = document.getElementById("lista");

  L.geoJSON(datos, {

    onEachFeature: function(feature, layer){

      var nombre =
        feature.properties.Nombre ||
        feature.properties.nombre ||
        "Punto de interés";

      var tipo =
        feature.properties.Tipo ||
        feature.properties.tipo ||
        "";

      var descripcion =
        feature.properties.descripcion ||
        feature.properties.Descripcion ||
        "";

      var contenido =
        "<b>" + nombre + "</b>";

      if(tipo){
        contenido += "<br>" + tipo;
      }

      if(descripcion){
        contenido += "<br>" + descripcion;
      }

      layer.bindPopup(contenido);

      var boton = document.createElement("button");

      boton.innerHTML = nombre;

      boton.onclick = function(){

        mapa.flyTo(
          layer.getLatLng(),
          20
        );

        layer.openPopup();

      };

      lista.appendChild(boton);

    }

  }).addTo(mapa);

});


// ---------------------------
// UBICACIÓN DEL VISITANTE
// ---------------------------

var marcadorUsuario;

function ubicar(){

  if(!navigator.geolocation){

    alert("Su navegador no soporta GPS.");
    return;

  }

  navigator.geolocation.getCurrentPosition(

    function(pos){

      var lat = pos.coords.latitude;
      var lon = pos.coords.longitude;

      if(marcadorUsuario){

        marcadorUsuario.setLatLng([lat,lon]);

      } else {

        marcadorUsuario = L.marker([lat,lon])
        .addTo(mapa)
        .bindPopup("📍 Usted está aquí");

      }

      marcadorUsuario.openPopup();

      mapa.flyTo(
        [lat,lon],
        20
      );

    },

    function(){

      alert("No fue posible obtener la ubicación. Autoriza el GPS.");

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}

</script>

</body>
</html>
