<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>HN SmartMap - Mundo Pangea</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html,
body {
    height: 100%;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
}

#map {
    width: 100%;
    height: 100%;
}


/* PANEL */

.panel {
    position: absolute;
    top: 12px;
    left: 55px;
    z-index: 1000;

    width: 290px;
    max-height: calc(100vh - 40px);

    background: rgba(255,255,255,0.96);

    border-radius: 12px;

    box-shadow:
    0 4px 18px rgba(0,0,0,0.25);

    padding: 14px;

    overflow-y: auto;
}


.titulo {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 3px;
}

.subtitulo {
    color: #666;
    font-size: 13px;
    margin-bottom: 12px;
}


/* BOTONES */

.boton-punto {

    width: 100%;

    margin-bottom: 6px;

    padding: 9px;

    border: 1px solid #ddd;

    border-radius: 7px;

    background: white;

    cursor: pointer;

    text-align: left;

    font-size: 13px;
}

.boton-punto:hover {
    background: #f1f1f1;
}


#ubicacion {

    width: 100%;

    margin-top: 10px;

    padding: 10px;

    border: none;

    border-radius: 7px;

    background: #26734d;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


.estado {

    margin-top: 8px;

    font-size: 12px;

    color: #555;
}


/* MARCADOR */

.punto-hn {

    width: 16px;

    height: 16px;

    background: #e53935;

    border: 3px solid white;

    border-radius: 50%;

    box-shadow: 0 1px 5px rgba(0,0,0,.7);
}


/* CELULAR */

@media(max-width:600px){

    .panel {

        left: 45px;

        top: 8px;

        width: 230px;

        max-height: 45vh;

    }

}

</style>

</head>


<body>


<div class="panel">

    <div class="titulo">
        HN SmartMap
    </div>

    <div class="subtitulo">
        Mundo Pangea
    </div>

    <div id="lista"></div>

    <button id="ubicacion">
        📍 Mi ubicación
    </button>

    <div class="estado" id="estado">
        Cargando mapa...
    </div>

</div>


<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


// ======================================================
// MAPA
// ======================================================

const mapa = L.map("map", {

    minZoom: 16,

    maxZoom: 22,

    zoomControl: true

});



// ======================================================
// MAPA BASE OPENSTREETMAP
// ======================================================

const osm = L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom: 22,

        attribution: "&copy; OpenStreetMap"

    }

).addTo(mapa);



// ======================================================
// ORTOMOSAICO PANGEA - TESELAS XYZ QGIS
// ======================================================

const ortomosaico = L.tileLayer(

    "./{z}/{x}/{y}.png",

    {

        minZoom: 17,

        maxZoom: 21,

        maxNativeZoom: 21,

        minNativeZoom: 17,

        tms: false,

        opacity: 1,

        attribution: "Ortomosaico Hacienda Nápoles"

    }

).addTo(mapa);



// ======================================================
// EXTENSIÓN DEL ORTOMOSAICO
// ======================================================

const limitesPangea = [

    [5.922009730, -74.728636],

    [5.925396137, -74.724673180]

];


mapa.fitBounds(limitesPangea);



// ======================================================
// CONTROL DE CAPAS
// ======================================================

L.control.layers(

    {

        "Mapa base": osm

    },

    {

        "Ortomosaico Pangea": ortomosaico

    },

    {

        collapsed: true

    }

).addTo(mapa);



// ======================================================
// ICONO DE PUNTOS
// ======================================================

const iconoHN = L.divIcon({

    className: "",

    html: '<div class="punto-hn"></div>',

    iconSize: [22,22],

    iconAnchor: [11,11],

    popupAnchor: [0,-12]

});



// ======================================================
// LEER PROPIEDADES
// ======================================================

function propiedad(objeto, nombres) {

    for(const nombre of nombres){

        if(
            objeto &&
            objeto[nombre] !== undefined &&
            objeto[nombre] !== null
        ){

            return String(objeto[nombre]);

        }

    }

    return "";

}



// ======================================================
// CARGAR PUNTOS GEOJSON
// ======================================================

const lista =
document.getElementById("lista");

const estado =
document.getElementById("estado");


fetch("./puntos_pangea.geojson")

.then(respuesta => {

    if(!respuesta.ok){

        throw new Error(
            "No se encontró puntos_pangea.geojson"
        );

    }

    return respuesta.json();

})

.then(datos => {


    const capaPuntos = L.geoJSON(

        datos,

        {


        pointToLayer:
        function(feature, latlng){

            return L.marker(

                latlng,

                {

                    icon: iconoHN

                }

            );

        },


        onEachFeature:
        function(feature, layer){


            const p =
            feature.properties || {};


            const nombre =

            propiedad(
                p,
                [
                    "Nombre",
                    "nombre",
                    "NAME",
                    "name"
                ]
            )

            || "Punto de interés";


            const tipo =

            propiedad(
                p,
                [
                    "Tipo",
                    "tipo",
                    "TYPE",
                    "type"
                ]
            );


            const descripcion =

            propiedad(
                p,
                [
                    "Descripcion",
                    "Descripción",
                    "descripcion",
                    "descripción"
                ]
            );


            let contenido =

            "<b>" +
            nombre +
            "</b>";


            if(tipo){

                contenido +=

                "<br>" +
                tipo;

            }


            if(descripcion){

                contenido +=

                "<br><br>" +
                descripcion;

            }


            layer.bindPopup(
                contenido
            );



            // BOTÓN LATERAL

            const boton =

            document.createElement(
                "button"
            );


            boton.className =
            "boton-punto";


            boton.innerHTML =
            "📍 " + nombre;


            boton.onclick =
            function(){


                mapa.flyTo(

                    layer.getLatLng(),

                    20,

                    {

                        duration: 0.8

                    }

                );


                layer.openPopup();

            };


            lista.appendChild(
                boton
            );


        }


    }

    ).addTo(mapa);


    estado.innerHTML =
    "Mapa listo · " +
    datos.features.length +
    " puntos cargados";


})

.catch(error => {

    console.error(error);

    estado.innerHTML =
    "⚠ No fue posible cargar los puntos.";

});



// ======================================================
// UBICACIÓN GPS
// ======================================================

let marcadorUsuario = null;

let circuloPrecision = null;


document
.getElementById("ubicacion")
.addEventListener(

"click",

function(){


    if(
        !navigator.geolocation
    ){

        alert(
            "Este dispositivo no permite obtener la ubicación."
        );

        return;

    }


    estado.innerHTML =
    "Buscando ubicación...";


    navigator.geolocation.getCurrentPosition(


        function(posicion){


            const lat =
            posicion.coords.latitude;


            const lon =
            posicion.coords.longitude;


            const precision =
            posicion.coords.accuracy;



            if(
                marcadorUsuario
            ){


                marcadorUsuario
                .setLatLng(
                    [lat,lon]
                );


                circuloPrecision
                .setLatLng(
                    [lat,lon]
                );


                circuloPrecision
                .setRadius(
                    precision
                );


            }

            else {


                marcadorUsuario =

                L.circleMarker(

                    [lat,lon],

                    {

                        radius: 8,

                        color: "white",

                        weight: 3,

                        fillColor: "#1976d2",

                        fillOpacity: 1

                    }

                )

                .addTo(mapa)

                .bindPopup(
                    "📍 Usted está aquí"
                );



                circuloPrecision =

                L.circle(

                    [lat,lon],

                    {

                        radius:
                        precision,

                        weight: 1,

                        fillOpacity: 0.08

                    }

                )

                .addTo(mapa);


            }


            mapa.flyTo(

                [lat,lon],

                20

            );


            marcadorUsuario
            .openPopup();


            estado.innerHTML =

            "Ubicación encontrada · precisión aprox. " +

            Math.round(
                precision
            )

            + " m";


        },


        function(error){


            console.error(error);


            estado.innerHTML =
            "No fue posible obtener tu ubicación.";


            alert(
                "Autoriza el uso de ubicación en el navegador."
            );


        },


        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }


    );


}

);


// ======================================================
// ERROR EN TESELAS
// ======================================================

ortomosaico.on(

    "tileerror",

    function(error){

        console.log(
            "Tesela no encontrada:",
            error.tile.src
        );

    }

);


</script>


</body>

</html>
