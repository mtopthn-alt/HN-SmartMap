<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mapa Inteligente Hacienda Nápoles - Pangea</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

html,body,#map{
height:100%;
margin:0;
padding:0;
}

.info{
position:absolute;
top:10px;
left:10px;
z-index:1000;
background:white;
padding:10px;
border-radius:8px;
font-family:Arial;
font-size:14px;
box-shadow:0 0 10px rgba(0,0,0,.3);
}

</style>

</head>

<body>

<div class="info">
<b>Mapa Inteligente Hacienda Nápoles</b><br>
Prueba Inicial
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map=L.map('map').setView([5.9233,-74.7268],18);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:22
}).addTo(map);


//-------------------------------------
// ORTOMOSAICO
//-------------------------------------

var bounds=[
[5.92455,-74.72815],
[5.92205,-74.72510]
];

L.imageOverlay(
'Ortomosaico_2.jpg',
bounds
).addTo(map);

map.fitBounds(bounds);


//-------------------------------------
// CARGAR PUNTOS DESDE GEOJSON
//-------------------------------------

fetch("puntos_pangea.geojson")

.then(response=>response.json())

.then(function(data){

L.geoJSON(data,{

onEachFeature:function(feature,layer){

let nombre="";

if(feature.properties.Nombre)
nombre=feature.properties.Nombre;

layer.bindPopup("<b>"+nombre+"</b>");

}

}).addTo(map);

});


//-------------------------------------
// UBICACIÓN DEL CELULAR
//-------------------------------------

map.locate({
setView:true,
maxZoom:20
});

function onLocationFound(e){

L.marker(e.latlng)
.addTo(map)
.bindPopup("Usted está aquí")
.openPopup();

}

map.on('locationfound',onLocationFound);

</script>

</body>

</html>
