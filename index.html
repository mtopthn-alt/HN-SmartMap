<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HN SmartMap - Mundo Pangea</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif}
#map{height:100%;width:100%}

.panel{
  position:absolute;top:12px;left:55px;z-index:1000;
  width:300px;max-height:calc(100vh - 40px);overflow-y:auto;
  padding:14px;background:rgba(255,255,255,.97);border-radius:12px;
  box-shadow:0 4px 18px rgba(0,0,0,.28)
}
.titulo{font-size:20px;font-weight:700}
.subtitulo{font-size:13px;color:#666;margin:2px 0 8px}
.horario{font-size:12px;font-weight:700;margin-bottom:10px}
#buscar{
  width:100%;box-sizing:border-box;padding:9px;margin-bottom:10px;
  border:1px solid #ccc;border-radius:7px;font-size:13px
}
.boton-punto{
  width:100%;margin-bottom:6px;padding:9px;border:1px solid #ddd;
  border-radius:7px;background:white;cursor:pointer;text-align:left;font-size:13px
}
.boton-punto:hover{background:#f2f2f2}
.accion{
  width:100%;margin-top:8px;padding:10px;border:0;border-radius:7px;
  color:white;font-weight:700;cursor:pointer
}
#ubicacion{background:#26734d}
#modoPrueba{background:#546e7a}
#limpiarRuta{background:#777;display:none}
.estado{margin-top:9px;font-size:12px;color:#555;line-height:1.35}
.ruta-info{
  margin-top:10px;padding:10px;border-radius:8px;background:#eef5ff;
  border:1px solid #c8dbf6;font-size:13px;display:none
}
.punto-hn{
  width:17px;height:17px;background:#e53935;border:3px solid white;
  border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.55)
}
.popup-titulo{font-size:16px;font-weight:700;margin-bottom:5px}
.popup-tipo{font-size:12px;color:#666;margin-bottom:8px}
.popup-descripcion{font-size:13px;margin-bottom:10px}
.popup-boton{
  display:block;box-sizing:border-box;width:100%;padding:9px 10px;
  background:#26734d;color:white;border:0;border-radius:6px;
  text-align:center;font-weight:700;cursor:pointer
}

@media(max-width:600px){
  .panel{left:45px;top:8px;width:245px;max-height:52vh;padding:11px}
  .titulo{font-size:17px}
}

/* =========================
   INTERFAZ MÓVIL / PANEL PLEGABLE
========================= */
#menuToggle{
  position:absolute;
  top:12px;
  left:12px;
  z-index:1200;
  width:44px;
  height:44px;
  border:0;
  border-radius:10px;
  background:rgba(255,255,255,.97);
  box-shadow:0 3px 12px rgba(0,0,0,.25);
  font-size:23px;
  cursor:pointer;
  display:none;
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

#cerrarPanel{
  border:0;
  background:transparent;
  font-size:20px;
  cursor:pointer;
  display:none;
}

@media(max-width:600px){
  #menuToggle{
    display:block;
  }

  .panel{
    position:absolute;
    left:12px;
    top:12px;
    width:min(330px, calc(100vw - 24px));
    max-height:calc(100vh - 24px);
    padding:14px;
    transform:translateX(calc(-100% - 24px));
    transition:transform .22s ease;
    box-sizing:border-box;
  }

  .panel.abierto{
    transform:translateX(0);
  }

  #cerrarPanel{
    display:block;
  }

  .dev-only{
    display:none !important;
  }

  body.panel-abierto #menuToggle{
    display:none;
  }

  .ruta-info{
    font-size:14px;
  }

  .boton-punto{
    padding:11px 10px;
    font-size:14px;
  }

  .accion{
    padding:12px;
    font-size:14px;
  }
}

</style>
</head>

<body>
<button id="menuToggle" aria-label="Abrir menú">☰</button>
<div id="panelPrincipal" class="panel">
  <div class="panel-head">
    <div class="titulo">HN SmartMap</div>
    <button id="cerrarPanel" aria-label="Cerrar menú">✕</button>
  </div>
  <div class="subtitulo">Mundo Pangea</div>
  <div id="horarioPangea" class="horario"></div>

  <input id="buscar" type="text" placeholder="🔍 Buscar punto...">
  <div id="lista"></div>

  <button id="ubicacion" class="accion">📍 Mi ubicación</button>
  <button id="modoPrueba" class="accion dev-only">🧪 Probar desde entrada Pangea</button>
  <button id="limpiarRuta" class="accion">✖ Limpiar ruta</button>

  <div id="rutaInfo" class="ruta-info"></div>
  <div id="estado" class="estado">Cargando mapa...</div>
</div>

<div id="map"></div>
<div id="rutaMini" style="
  display:none;
  position:absolute;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:1100;
  background:rgba(255,255,255,.96);
  padding:9px 13px;
  border-radius:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.25);
  font:600 13px Arial,Helvetica,sans-serif;
  white-space:nowrap;
"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================
   CONFIGURACIÓN
===================================================== */
const VERSION = "7";

const panelPrincipal = document.getElementById("panelPrincipal");
const menuToggle = document.getElementById("menuToggle");
const cerrarPanel = document.getElementById("cerrarPanel");

function abrirPanel(){
  panelPrincipal.classList.add("abierto");
  document.body.classList.add("panel-abierto");
}

function cerrarPanelMovil(){
  panelPrincipal.classList.remove("abierto");
  document.body.classList.remove("panel-abierto");
}

menuToggle.addEventListener("click", abrirPanel);
cerrarPanel.addEventListener("click", cerrarPanelMovil);

// En escritorio queda siempre visible.
// En celular se abre al inicio y se oculta automáticamente luego de unos segundos.
if(window.matchMedia("(max-width:600px)").matches){
  abrirPanel();
  setTimeout(() => {
    if(!rutaActual) cerrarPanelMovil();
  }, 3500);
}else{
  panelPrincipal.classList.add("abierto");
}

const VELOCIDAD_CAMINANDO_M_MIN = 75;
const TOLERANCIA_UNION_RED_M = 8;
const MAX_DISTANCIA_ORIGEN_RED_M = 150;

const mapa = L.map("map",{
  minZoom:16,
  maxZoom:22,
  zoomControl:true,
  preferCanvas:true
});

const osm = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {minZoom:1,maxZoom:22,maxNativeZoom:19,attribution:"&copy; OpenStreetMap"}
).addTo(mapa);

const limitesPangea = L.latLngBounds(
  [5.922009730,-74.728636],
  [5.925396137,-74.724673180]
);

const ortomosaico = L.tileLayer(
  "./{z}/{x}/{y}.png?v=" + VERSION,
  {
    minZoom:17,maxZoom:22,minNativeZoom:17,maxNativeZoom:21,
    tms:false,opacity:1,bounds:limitesPangea,noWrap:true,
    keepBuffer:4,updateWhenIdle:false,
    attribution:"Ortomosaico Hacienda Nápoles"
  }
).addTo(mapa);

mapa.fitBounds(limitesPangea,{padding:[20,20]});

const capasBase = {"🗺️ OpenStreetMap":osm};
const capasSuperpuestas = {"🛰️ Ortomosaico Pangea":ortomosaico};
L.control.layers(capasBase,capasSuperpuestas,{collapsed:true}).addTo(mapa);
L.control.scale({metric:true,imperial:false,position:"bottomleft"}).addTo(mapa);

/* =====================================================
   UI
===================================================== */
const lista = document.getElementById("lista");
const estado = document.getElementById("estado");
const buscar = document.getElementById("buscar");
const horarioPangea = document.getElementById("horarioPangea");
const rutaInfo = document.getElementById("rutaInfo");
const btnLimpiar = document.getElementById("limpiarRuta");
const rutaMini = document.getElementById("rutaMini");

function actualizarHorarioPangea(){
  const ahora = new Date();
  const dia = ahora.getDay(); // domingo=0
  const hora = ahora.getHours() + ahora.getMinutes()/60;
  const abierto = [0,4,5,6].includes(dia) && hora >= 10 && hora < 16;

  horarioPangea.textContent = abierto
    ? "🟢 Abierto · Jue–Dom · 10:00 a. m. – 4:00 p. m."
    : "🔴 Cerrado · Jue–Dom · 10:00 a. m. – 4:00 p. m.";
}
actualizarHorarioPangea();

/* =====================================================
   VARIABLES
===================================================== */
let puntosCargados = [];
let capaPuntos = null;
let marcadorUsuario = null;
let circuloPrecision = null;
let rutaActual = null;
let nodosRed = [];
let redLista = false;
let contadorDestinos = 0;

window.destinosHN = {};

/* =====================================================
   UTILIDADES
===================================================== */
function obtenerPropiedad(propiedades,nombres){
  for(const nombre of nombres){
    if(propiedades[nombre] !== undefined && propiedades[nombre] !== null){
      return String(propiedades[nombre]);
    }
  }
  return "";
}

function emojiTipo(tipo){
  const t = (tipo || "").toLowerCase();
  if(t.includes("museo")) return "🏛️";
  if(t.includes("atraccion") || t.includes("atracción")) return "🎢";
  if(t.includes("venta")) return "🥤";
  if(t.includes("baño")) return "🚻";
  if(t.includes("restaurante")) return "🍔";
  return "📍";
}

function distanciaMetros(a,b){
  const R = 6371000;
  const lat1 = a.lat*Math.PI/180;
  const lat2 = b.lat*Math.PI/180;
  const dLat = (b.lat-a.lat)*Math.PI/180;
  const dLon = (b.lng-a.lng)*Math.PI/180;

  const h =
    Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1)*Math.cos(lat2)*
    Math.sin(dLon/2)*Math.sin(dLon/2);

  return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

/* =====================================================
   RED DE SENDEROS
===================================================== */
function obtenerOCrearNodo(punto){
  for(const nodo of nodosRed){
    if(distanciaMetros(nodo,punto) <= 1.5) return nodo;
  }

  const nuevo = {
    id:nodosRed.length,
    lat:punto.lat,
    lng:punto.lng,
    conexiones:[]
  };

  nodosRed.push(nuevo);
  return nuevo;
}

function estanConectados(a,b){
  return a.conexiones.some(c => c.nodo.id === b.id);
}

function conectarNodos(a,b){
  if(estanConectados(a,b)) return;
  const d = distanciaMetros(a,b);
  a.conexiones.push({nodo:b,distancia:d});
  b.conexiones.push({nodo:a,distancia:d});
}

function construirRed(datos){
  nodosRed = [];

  for(const feature of datos.features || []){
    if(!feature.geometry || feature.geometry.type !== "LineString") continue;

    let anterior = null;

    for(const c of feature.geometry.coordinates){
      const actual = obtenerOCrearNodo({lat:c[1],lng:c[0]});
      if(anterior) conectarNodos(anterior,actual);
      anterior = actual;
    }
  }

  // Une pequeños espacios dejados entre líneas al digitalizar en QGIS.
  for(let i=0;i<nodosRed.length;i++){
    for(let j=i+1;j<nodosRed.length;j++){
      const a = nodosRed[i];
      const b = nodosRed[j];

      if(distanciaMetros(a,b) <= TOLERANCIA_UNION_RED_M){
        conectarNodos(a,b);
      }
    }
  }

  redLista = nodosRed.length > 0;
  estado.textContent = redLista
    ? "✅ Mapa y red de senderos listos"
    : "⚠️ La red de senderos está vacía";

  console.log("Red HN lista:",nodosRed.length,"nodos");
}

function nodoMasCercano(punto){
  let mejor = null;
  let dMejor = Infinity;

  for(const nodo of nodosRed){
    const d = distanciaMetros(punto,nodo);
    if(d < dMejor){
      dMejor = d;
      mejor = nodo;
    }
  }

  return {nodo:mejor,distancia:dMejor};
}

/* =====================================================
   DIJKSTRA - CAMINO MÁS CORTO
===================================================== */
function calcularCamino(inicio,fin){
  const dist = {};
  const prev = {};
  const pendientes = new Set();

  for(const n of nodosRed){
    dist[n.id] = Infinity;
    pendientes.add(n.id);
  }

  dist[inicio.id] = 0;

  while(pendientes.size){
    let actual = null;
    let mejor = Infinity;

    for(const id of pendientes){
      if(dist[id] < mejor){
        mejor = dist[id];
        actual = id;
      }
    }

    if(actual === null) break;
    if(actual === fin.id) break;

    pendientes.delete(actual);

    for(const conexion of nodosRed[actual].conexiones){
      const vecino = conexion.nodo.id;
      if(!pendientes.has(vecino)) continue;

      const nd = dist[actual] + conexion.distancia;

      if(nd < dist[vecino]){
        dist[vecino] = nd;
        prev[vecino] = actual;
      }
    }
  }

  if(dist[fin.id] === Infinity) return null;

  const camino = [];
  let actual = fin.id;

  while(actual !== undefined){
    camino.unshift(nodosRed[actual]);

    if(actual === inicio.id) break;
    actual = prev[actual];
  }

  return {camino:camino,distancia:dist[fin.id]};
}

/* =====================================================
   DIBUJAR RUTA INTERNA
===================================================== */
function navegarA(layer,nombre){
  mapa.closePopup();

  if(!redLista){
    alert("La red de senderos todavía no ha cargado.");
    return;
  }

  if(!marcadorUsuario){
    alert("Primero pulsa 📍 Mi ubicación o usa 🧪 Probar desde entrada Pangea.");
    return;
  }

  const origen = marcadorUsuario.getLatLng();
  const destino = layer.getLatLng();

  const inicio = nodoMasCercano(origen);
  const fin = nodoMasCercano(destino);

  if(!inicio.nodo || !fin.nodo){
    alert("No fue posible conectar el origen o destino con la red.");
    return;
  }

  if(inicio.distancia > MAX_DISTANCIA_ORIGEN_RED_M){
    alert(
      "Tu ubicación está fuera de la red que hemos dibujado por ahora. " +
      "Para probar Pangea, pulsa 🧪 Probar desde entrada Pangea. " +
      "Cuando dibujemos los senderos del resto del parque, funcionará desde Cataratas, Congo y demás zonas."
    );
    return;
  }

  const resultado = calcularCamino(inicio.nodo,fin.nodo);

  if(!resultado){
    alert("No encontramos una ruta conectada hasta este destino.");
    return;
  }

  if(rutaActual) mapa.removeLayer(rutaActual);

  const puntosRuta = [
    origen,
    ...resultado.camino.map(n => [n.lat,n.lng]),
    destino
  ];

  rutaActual = L.polyline(
    puntosRuta,
    {
      color:"#1976d2",
      weight:7,
      opacity:.95,
      lineJoin:"round",
      lineCap:"round"
    }
  ).addTo(mapa);

  const distanciaTotal =
    resultado.distancia +
    inicio.distancia +
    fin.distancia;

  const minutos = Math.max(
    1,
    Math.round(distanciaTotal/VELOCIDAD_CAMINANDO_M_MIN)
  );

  rutaInfo.style.display = "block";
  rutaInfo.innerHTML =
    "<b>🧭 " + nombre + "</b><br>" +
    "📏 " + Math.round(distanciaTotal) + " m<br>" +
    "🚶 " + minutos + " min caminando";

  btnLimpiar.style.display = "block";
  rutaMini.style.display = "block";
  rutaMini.innerHTML = "🧭 " + nombre + " · " + Math.round(distanciaTotal) + " m · " + minutos + " min";

  estado.textContent = "Ruta calculada sobre los senderos de Pangea";
  mapa.fitBounds(rutaActual.getBounds(),{padding:[60,60]});
  if(window.matchMedia("(max-width:600px)").matches){
    abrirPanel();
    setTimeout(cerrarPanelMovil,4500);
  }
}

function limpiarRuta(){
  if(rutaActual){
    mapa.removeLayer(rutaActual);
    rutaActual = null;
  }
  rutaInfo.style.display = "none";
  rutaInfo.innerHTML = "";
  btnLimpiar.style.display = "none";
  rutaMini.style.display = "none";
}

btnLimpiar.addEventListener("click",limpiarRuta);

/* =====================================================
   CARGAR PUNTOS
===================================================== */
const iconoHN = L.divIcon({
  className:"",
  html:'<div class="punto-hn"></div>',
  iconSize:[23,23],
  iconAnchor:[11,11],
  popupAnchor:[0,-13]
});

fetch("./puntos_pangea.geojson?v=" + VERSION)
.then(r => {
  if(!r.ok) throw new Error("No se pudo cargar puntos_pangea.geojson");
  return r.json();
})
.then(datos => {
  capaPuntos = L.geoJSON(datos,{
    pointToLayer:function(feature,latlng){
      return L.marker(latlng,{icon:iconoHN});
    },

    onEachFeature:function(feature,layer){
      const p = feature.properties || {};

      const nombre =
        obtenerPropiedad(p,["Nombre","nombre","NAME","name"]) ||
        "Punto de interés";

      const tipo =
        obtenerPropiedad(p,["Tipo","tipo","TYPE","type"]);

      const descripcion =
        obtenerPropiedad(
          p,
          ["descripcion","Descripcion","Descripción","descripción"]
        );

      const emoji = emojiTipo(tipo);
      const idDestino = "destino_" + (++contadorDestinos);

      window.destinosHN[idDestino] = {
        layer:layer,
        feature:feature,
        nombre:nombre
      };

      let popup =
        '<div class="popup-titulo">' + emoji + " " + nombre + "</div>";

      if(tipo){
        popup += '<div class="popup-tipo">' + tipo + "</div>";
      }

      if(descripcion){
        popup += '<div class="popup-descripcion">' + descripcion + "</div>";
      }

      popup +=
        '<button class="popup-boton" ' +
        'onclick="navegarA(window.destinosHN[\'' + idDestino + '\'].layer,' +
        'window.destinosHN[\'' + idDestino + '\'].nombre)">' +
        "🧭 Cómo llegar por el parque" +
        "</button>";

      layer.bindPopup(popup,{maxWidth:270});

      const boton = document.createElement("button");
      boton.className = "boton-punto";
      boton.dataset.nombre = nombre.toLowerCase();
      boton.innerHTML = emoji + " " + nombre;

      boton.onclick = function(){
        mapa.flyTo(layer.getLatLng(),20,{duration:.8});
        setTimeout(() => layer.openPopup(),450);
        if(window.matchMedia("(max-width:600px)").matches){
          setTimeout(cerrarPanelMovil,700);
        }
      };

      lista.appendChild(boton);

      puntosCargados.push({
        nombre:nombre,
        layer:layer,
        boton:boton
      });
    }
  }).addTo(mapa);

  estado.textContent = "✅ " + datos.features.length + " puntos cargados";
})
.catch(error => {
  console.error(error);
  estado.textContent = "⚠️ No fue posible cargar los puntos";
});

/* =====================================================
   CARGAR SENDEROS
===================================================== */
fetch("./senderos_pangea.geojson?v=" + VERSION)
.then(r => {
  if(!r.ok) throw new Error("No se encontró senderos_pangea.geojson");
  return r.json();
})
.then(datos => construirRed(datos))
.catch(error => {
  console.error(error);
  estado.textContent = "⚠️ No fue posible cargar senderos_pangea.geojson";
});

/* =====================================================
   BUSCADOR
===================================================== */
buscar.addEventListener("input",function(){
  const texto = this.value.toLowerCase().trim();

  puntosCargados.forEach(punto => {
    punto.boton.style.display =
      punto.nombre.toLowerCase().includes(texto) ? "block" : "none";
  });
});

/* =====================================================
   GPS
===================================================== */
function ponerUbicacion(lat,lon,precision=10,texto="📍 Usted está aquí"){
  if(marcadorUsuario){
    marcadorUsuario.setLatLng([lat,lon]);

    if(circuloPrecision){
      circuloPrecision.setLatLng([lat,lon]);
      circuloPrecision.setRadius(precision);
    }
  }else{
    marcadorUsuario = L.circleMarker(
      [lat,lon],
      {
        radius:8,
        color:"white",
        weight:3,
        fillColor:"#1976d2",
        fillOpacity:1
      }
    ).addTo(mapa).bindPopup(texto);

    circuloPrecision = L.circle(
      [lat,lon],
      {
        radius:precision,
        weight:1,
        color:"#1976d2",
        fillColor:"#1976d2",
        fillOpacity:.08
      }
    ).addTo(mapa);
  }

  marcadorUsuario.bindPopup(texto);
  mapa.flyTo([lat,lon],20);
  marcadorUsuario.openPopup();
}

document.getElementById("ubicacion").addEventListener("click",function(){
  if(!navigator.geolocation){
    alert("Este dispositivo no permite obtener ubicación.");
    return;
  }

  estado.textContent = "📡 Buscando ubicación...";

  navigator.geolocation.getCurrentPosition(
    function(pos){
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const precision = pos.coords.accuracy;

      ponerUbicacion(lat,lon,precision,"📍 Usted está aquí");

      estado.textContent =
        "📍 Precisión aproximada: " + Math.round(precision) + " m";
    },

    function(error){
      console.error(error);
      estado.textContent = "⚠️ No fue posible obtener ubicación";
      alert("Autoriza el uso de ubicación en el navegador.");
    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
});

/* =====================================================
   MODO PRUEBA - ENTRADA PANGEA
===================================================== */
document.getElementById("modoPrueba").addEventListener("click",function(){
  // Punto situado sobre el inicio de la Vía Pangea que digitalizaste.
  ponerUbicacion(
    5.923356428386153,
    -74.728420095808190,
    5,
    "🧪 Ubicación de prueba: entrada Pangea"
  );

  estado.textContent =
    "🧪 Modo prueba activo. Ahora toca un destino y luego Cómo llegar.";
});

/* =====================================================
   DIAGNÓSTICO
===================================================== */
ortomosaico.on("tileerror",function(error){
  console.log("Tesela no encontrada:",error.tile.src);
});
</script>
</body>
</html>
