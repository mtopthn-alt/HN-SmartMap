<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HN SmartMap - Pangea</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
height:100%;
margin:0;
}

#map{
height:100%;
width:100%;
}

.info{
position:absolute;
top:10px;
left:10px;
z-index:1000;
background:white;
padding:10px;
border-radius:8px;
font-family:Arial;
box-shadow:0 0 10px rgba(0,0,0,.3);
}

button{
width:100%;
margin-top:6px;
padding:8px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="info">

<b>HN SmartMap</b><br>
Pangea<br><br>

<div id="lista"></div>

<button onclick="ubicar()">

Mi ubicación

</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var mapa=L.map('map');

var limites=[

[5.922010,-74.728629],

[5.925396,-74.724673]

];

L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

{

maxZoom:22

}

).addTo(mapa);

L.imageOverlay(

'Ortomosaico_2.jpg',

limites

).addTo(mapa);

mapa.fitBounds(limites);

fetch('puntos_pangea.geojson')

.then(r=>r.json())

.then(function(datos){

var lista=document.getElementById("lista");

L.geoJSON(datos,{

onEachFeature:function(feature,layer){

var nombre=feature.properties.Nombre;

layer.bindPopup("<b>"+nombre+"</b>");

var b=document.createElement("button");

b.innerHTML=nombre;

b.onclick=function(){

mapa.flyTo(layer.getLatLng(),20);

layer.openPopup();

};

lista.appendChild(b);

}

}).addTo(mapa);

});
function ubicar(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(

function(pos){

var lat=pos.coords.latitude;

var lon=pos.coords.longitude;

L.marker([lat,lon])

.addTo(mapa)

.bindPopup("📍 Usted está aquí")

.openPopup();

mapa.flyTo([lat,lon],20);

},

function(){

alert("No fue posible obtener la ubicación.");

},

{

enableHighAccuracy:true

}

);

}

else{

alert("Su navegador no soporta GPS.");

}

}

</script>

</body>

</html>
