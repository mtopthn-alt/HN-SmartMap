
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HN SmartMap - Pangea</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body,#map{height:100%;margin:0}
.info{position:absolute;z-index:1000;top:10px;left:10px;background:white;padding:8px 12px;border-radius:8px;font-family:Arial}
</style>
</head>
<body>
<div class="info"><b>HN SmartMap - Pangea</b><br>Prueba inicial</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map=L.map('map').setView([5.9232,-74.7268],18);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22}).addTo(map);

const pts=[
["Museo Mundo de Pangea",5.92325,-74.72735],
["Pangea Kids",5.92360,-74.72655],
["Punto de Venta",5.92305,-74.72695],
["Baños",5.92340,-74.72695]
];

pts.forEach(p=>L.marker([p[1],p[2]]).addTo(map).bindPopup("<b>"+p[0]+"</b>"));

if(navigator.geolocation){
 navigator.geolocation.getCurrentPosition(function(pos){
   L.circleMarker([pos.coords.latitude,pos.coords.longitude],{radius:8}).addTo(map).bindPopup("Mi ubicación");
 });
}
</script>
</body>
</html>
